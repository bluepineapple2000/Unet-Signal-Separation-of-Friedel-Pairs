[project]
name = "diffraction-spot-separation"
version = "0.1.0"
description = "U-Net experiments for separating overlapping diffraction spots in ESRF DCT data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "hdf5plugin>=5.1.0",
    "h5py>=3.11.0",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "tensorboard>=2.20.0",
    "torch>=2.4.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.0.0",
    "jupyterlab>=4.0.0",
    "nbformat>=5.10.0",
    "pandas>=2.0.0",
    "plotly>=6.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
